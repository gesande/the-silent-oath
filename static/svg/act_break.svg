<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="absky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050508"/>
      <stop offset="50%"  stop-color="#0A0810"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <radialGradient id="ab_glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#302050" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#100810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ab_fog_center" cx="50%" cy="80%" r="50%">
      <stop offset="0%"   stop-color="#181420" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#181420" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="420" fill="url(#absky)"/>
  <rect width="800" height="420" fill="url(#ab_glow)"/>

  <!-- Dense star field — this is the void between acts -->
  <g fill="#C8C0E0" opacity="0.8">
    <circle cx="40"  cy="18"  r="1.2"/><circle cx="95"  cy="42"  r="0.9"/>
    <circle cx="155" cy="12"  r="1.4"/><circle cx="210" cy="55"  r="1.0"/>
    <circle cx="275" cy="28"  r="0.8"/><circle cx="330" cy="68"  r="1.1"/>
    <circle cx="390" cy="20"  r="1.3"/><circle cx="448" cy="48"  r="0.9"/>
    <circle cx="510" cy="15"  r="1.2"/><circle cx="568" cy="38"  r="1.0"/>
    <circle cx="625" cy="22"  r="0.8"/><circle cx="692" cy="58"  r="1.3"/>
    <circle cx="750" cy="32"  r="1.0"/><circle cx="780" cy="14"  r="0.9"/>
    <circle cx="72"  cy="85"  r="0.9"/><circle cx="140" cy="100" r="1.1"/>
    <circle cx="225" cy="90"  r="0.8"/><circle cx="308" cy="110" r="1.0"/>
    <circle cx="415" cy="95"  r="0.9"/><circle cx="498" cy="115" r="1.2"/>
    <circle cx="572" cy="88"  r="0.8"/><circle cx="648" cy="102" r="1.0"/>
    <circle cx="718" cy="92"  r="0.9"/><circle cx="760" cy="118" r="1.1"/>
  </g>

  <!-- Faint Milky Way sweep -->
  <ellipse cx="400" cy="100" rx="380" ry="45" fill="#201828" opacity="0.25"/>
  <ellipse cx="420" cy="95"  rx="300" ry="28" fill="#281830" opacity="0.15"/>

  <!-- Ground — barely visible, far below -->
  <rect x="0" y="340" width="800" height="80" fill="#0A0808"/>
  <path d="M0,345 Q400,338 800,345" stroke="#181210" stroke-width="1" fill="none"/>

  <!-- Distant frozen mountains — Act II cold hint -->
  <polygon points="0,345 50,280 110,310 180,240 250,290 320,220 400,270 480,215 550,260 620,200 700,250 760,220 800,245 800,345"
           fill="#0C0E14"/>
  <polygon points="0,345 30,295 90,320 150,268 220,305 290,255 370,285 450,240 520,272 590,228 660,265 730,242 800,258 800,345"
           fill="#0A0C10"/>

  <!-- Snow caps on peaks — frost blue -->
  <path d="M178,240 Q190,232 202,240 L196,244 L184,244 Z" fill="#1C2838" opacity="0.7"/>
  <path d="M318,220 Q330,212 342,220 L336,224 L324,224 Z" fill="#1C2838" opacity="0.7"/>
  <path d="M478,215 Q490,207 502,215 L496,219 L484,219 Z" fill="#1C2838" opacity="0.7"/>
  <path d="M618,200 Q630,192 642,200 L636,204 L624,204 Z" fill="#1C2838" opacity="0.7"/>

  <!-- Central rune pillar of light — thin beam upward -->
  <rect x="397" y="140" width="6" height="200" fill="#2A1840" opacity="0.3"/>
  <rect x="399" y="160" width="2" height="180" fill="#6040A0" opacity="0.2"/>

  <!-- Rune inscription at centre -->
  <text x="400" y="220" font-family="serif" font-size="48"
        text-anchor="middle" fill="#4A3878" opacity="0.35">ᚠ</text>
  <text x="400" y="260" font-family="serif" font-size="28"
        text-anchor="middle" fill="#3A2858" opacity="0.25">ᚨ ᛏ ᚾ</text>

  <!-- Bottom fog -->
  <rect x="0" y="310" width="800" height="110" fill="url(#ab_fog_center)"/>
  <ellipse cx="400" cy="350" rx="380" ry="30" fill="#141018" opacity="0.5"/>

  <!-- Heavy vignette — feel of the void -->
  <radialGradient id="abvig" cx="50%" cy="50%" r="55%">
    <stop offset="20%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.85"/>
  </radialGradient>
  <rect width="800" height="420" fill="url(#abvig)"/>
</svg>
