<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="60%" stop-color="#0D1018"/>
      <stop offset="100%" stop-color="#141008"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1610"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1018" stop-opacity="0"/>
      <stop offset="100%" stop-color="#141210" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="moon_g" cx="40%" cy="40%" r="50%" fx="40%" fy="40%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#D4C890"/>
      <stop offset="100%" stop-color="#5A4A20"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#C8C0A0" opacity="0.6">
    <circle cx="80"  cy="30"  r="0.8"/>
    <circle cx="150" cy="18"  r="1.2"/>
    <circle cx="240" cy="45"  r="0.9"/>
    <circle cx="320" cy="22"  r="0.7"/>
    <circle cx="410" cy="38"  r="1.1"/>
    <circle cx="500" cy="15"  r="0.8"/>
    <circle cx="590" cy="50"  r="1.0"/>
    <circle cx="680" cy="28"  r="0.9"/>
    <circle cx="740" cy="42"  r="1.3"/>
    <circle cx="55"  cy="70"  r="0.7"/>
    <circle cx="200" cy="80"  r="0.8"/>
    <circle cx="460" cy="65"  r="1.0"/>
    <circle cx="620" cy="75"  r="0.7"/>
    <circle cx="770" cy="60"  r="0.9"/>
  </g>

  <!-- Moon -->
  <circle cx="660" cy="65" r="32" fill="#7A6840" opacity="0.15"/>
  <circle cx="660" cy="65" r="26" fill="#D4C890"/>
  <circle cx="654" cy="59" r="4"  fill="#B8A870" opacity="0.6"/>
  <circle cx="668" cy="72" r="2.5" fill="#B8A870" opacity="0.4"/>
  <circle cx="650" cy="74" r="3"  fill="#B8A870" opacity="0.3"/>

  <!-- Distant mountains -->
  <polygon points="0,280 60,180 120,240 190,150 260,210 330,130 400,200 470,140 540,190 610,120 680,175 750,145 800,180 800,280" fill="#0C1018"/>
  <polygon points="0,290 40,220 100,260 160,200 230,240 290,185 360,225 430,175 500,215 570,165 640,200 710,170 800,195 800,290" fill="#0F1420"/>

  <!-- Ground -->
  <rect x="0" y="270" width="800" height="150" fill="url(#ground)"/>

  <!-- Ground texture / mud lines -->
  <path d="M0,290 Q200,285 400,292 Q600,299 800,288" stroke="#2A2418" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M0,310 Q150,305 350,312 Q550,319 800,308" stroke="#2A2418" stroke-width="0.8" fill="none" opacity="0.4"/>

  <!-- Fallen bodies silhouettes -->
  <ellipse cx="120" cy="285" rx="28" ry="8" fill="#181410" opacity="0.8"/>
  <ellipse cx="340" cy="278" rx="35" ry="9" fill="#181410" opacity="0.7"/>
  <ellipse cx="580" cy="282" rx="30" ry="8" fill="#181410" opacity="0.8"/>
  <ellipse cx="700" cy="276" rx="22" ry="7" fill="#181410" opacity="0.6"/>

  <!-- Spears / weapons in ground -->
  <line x1="95"  y1="230" x2="100" y2="280" stroke="#2A2420" stroke-width="2.5"/>
  <line x1="220" y1="215" x2="215" y2="275" stroke="#2A2420" stroke-width="2"/>
  <line x1="380" y1="225" x2="385" y2="278" stroke="#2A2420" stroke-width="2.5"/>
  <line x1="500" y1="218" x2="496" y2="272" stroke="#2A2420" stroke-width="2"/>
  <line x1="640" y1="222" x2="645" y2="276" stroke="#2A2420" stroke-width="2.5"/>
  <line x1="730" y1="230" x2="726" y2="278" stroke="#2A2420" stroke-width="2"/>
  <!-- Spear tips -->
  <polygon points="95,230 91,218 99,218" fill="#383020"/>
  <polygon points="220,215 216,203 224,203" fill="#383020"/>
  <polygon points="381,225 377,213 385,213" fill="#383020"/>
  <polygon points="498,218 494,206 502,206" fill="#383020"/>
  <polygon points="642,222 638,210 646,210" fill="#383020"/>
  <polygon points="728,230 724,218 732,218" fill="#383020"/>

  <!-- Broken shield in foreground -->
  <path d="M160,285 Q175,268 190,278 Q185,290 170,295 Z" fill="#2A2018" stroke="#3A3020" stroke-width="1"/>
  <path d="M430,280 Q450,262 462,274 Q455,288 442,292 Z" fill="#2A2018" stroke="#3A3020" stroke-width="1"/>

  <!-- Fog layer -->
  <rect x="0" y="200" width="800" height="100" fill="url(#fog)"/>

  <!-- Atmospheric fog wisps -->
  <ellipse cx="200" cy="268" rx="140" ry="20" fill="#1A1C18" opacity="0.3"/>
  <ellipse cx="550" cy="262" rx="160" ry="18" fill="#1A1C18" opacity="0.25"/>
  <ellipse cx="400" cy="272" rx="200" ry="15" fill="#141410" opacity="0.2"/>

  <!-- Dark vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="70%">
    <stop offset="30%" stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
  </radialGradient>
  <rect width="800" height="420" fill="url(#vig)"/>
</svg>
