<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050408"/>
      <stop offset="100%" stop-color="#0C0808"/>
    </linearGradient>
    <radialGradient id="specter" cx="50%" cy="35%" r="45%">
      <stop offset="0%"   stop-color="#2A1A4A" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#100808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#4A8898" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1A3040" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="420" fill="url(#gsky)"/>
  <rect width="800" height="420" fill="url(#specter)"/>

  <!-- Very dim stars -->
  <g fill="#8880A0" opacity="0.35">
    <circle cx="100" cy="25" r="0.9"/><circle cx="250" cy="18" r="1.0"/>
    <circle cx="400" cy="30" r="0.8"/><circle cx="580" cy="22" r="1.1"/>
    <circle cx="720" cy="38" r="0.9"/>
  </g>

  <!-- Ground — dark, packed earth -->
  <rect x="0" y="320" width="800" height="100" fill="#0A0808"/>
  <ellipse cx="400" cy="320" rx="400" ry="12" fill="#0D0A0A"/>

  <!-- Mound rises in background -->
  <ellipse cx="400" cy="320" rx="380" ry="90" fill="#0E0C10"/>
  <ellipse cx="400" cy="315" rx="340" ry="75" fill="#0C0A0E"/>

  <!-- Atmospheric cross-markers behind Gunnar -->
  <line x1="220" y1="180" x2="222" y2="260" stroke="#1A1420" stroke-width="3" opacity="0.5"/>
  <line x1="210" y1="200" x2="234" y2="200" stroke="#1A1420" stroke-width="2.5" opacity="0.5"/>
  <line x1="570" y1="175" x2="568" y2="258" stroke="#1A1420" stroke-width="3" opacity="0.5"/>
  <line x1="558" y1="196" x2="582" y2="196" stroke="#1A1420" stroke-width="2.5" opacity="0.5"/>

  <!-- GUNNAR — imposing figure, centre stage -->
  <!-- Shadow / weight on ground -->
  <ellipse cx="400" cy="325" rx="65" ry="12" fill="#050405" opacity="0.8"/>

  <!-- Legs — wide stance -->
  <rect x="370" y="290" width="22" height="65" rx="5" fill="#151018" transform="rotate(-4,381,322)"/>
  <rect x="408" y="290" width="22" height="65" rx="5" fill="#151018" transform="rotate(4,419,322)"/>
  <!-- Boot details -->
  <rect x="367" y="342" width="28" height="14" rx="3" fill="#111018"/>
  <rect x="406" y="342" width="28" height="14" rx="3" fill="#111018"/>

  <!-- Cloak / cape — billowing slightly left -->
  <path d="M350,170 Q310,220 295,310 Q340,320 360,290 L380,185 Z" fill="#120E18"/>
  <path d="M450,170 Q490,215 510,305 Q465,318 445,288 L422,183 Z" fill="#120E18"/>

  <!-- Torso — heavy plate -->
  <rect x="360" y="170" width="80" height="130" rx="6" fill="#181420"/>
  <!-- Armour plates -->
  <rect x="363" y="175" width="74" height="15" rx="2" fill="#201A28" opacity="0.8"/>
  <rect x="363" y="195" width="74" height="15" rx="2" fill="#1C1824" opacity="0.7"/>
  <rect x="363" y="215" width="74" height="15" rx="2" fill="#201A28" opacity="0.6"/>
  <!-- Belt -->
  <rect x="358" y="285" width="84" height="10" rx="2" fill="#2A2020"/>
  <!-- Rune on chest -->
  <text x="400" y="260" font-family="serif" font-size="18" text-anchor="middle" fill="#3A6878" opacity="0.6">ᚠ</text>

  <!-- LEFT ARM — raised, holding axe -->
  <path d="M360,200 Q320,215 305,240 Q295,255 300,270" stroke="#181420" stroke-width="22" fill="none" stroke-linecap="round"/>
  <path d="M360,200 Q320,215 305,240 Q295,255 300,270" stroke="#201828" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Axe handle -->
  <line x1="300" y1="270" x2="270" y2="320" stroke="#2A2018" stroke-width="6" stroke-linecap="round"/>
  <!-- Axe head — broad, weathered -->
  <path d="M262,308 Q248,290 255,275 Q270,268 282,280 Q285,295 278,315 Z" fill="#282018"/>
  <path d="M262,308 Q248,290 255,275 Q270,268 282,280 Q285,295 278,315 Z" stroke="#403820" stroke-width="1.5" fill="none"/>
  <!-- Blade edge -->
  <path d="M255,275 Q245,280 248,295 Q250,308 262,308" stroke="#505040" stroke-width="1" fill="none"/>

  <!-- RIGHT ARM — at side, slightly raised -->
  <path d="M440,205 Q480,225 492,255 Q500,270 496,285" stroke="#181420" stroke-width="20" fill="none" stroke-linecap="round"/>

  <!-- NECK & HEAD -->
  <rect x="388" y="145" width="24" height="30" rx="4" fill="#151018"/>
  <!-- Head -->
  <ellipse cx="400" cy="128" rx="32" ry="36" fill="#141018"/>
  <!-- Helmet -->
  <path d="M368,128 Q368,90 400,85 Q432,90 432,128 Z" fill="#1C1820"/>
  <path d="M368,128 Q368,90 400,85 Q432,90 432,128" stroke="#2C2430" stroke-width="1.5" fill="none"/>
  <!-- Nasal guard -->
  <rect x="397" y="112" width="6" height="22" rx="2" fill="#242030"/>
  <!-- Cheek guards -->
  <path d="M368,128 Q364,118 370,112 Q372,108 376,112 L376,128" fill="#1A1620"/>
  <path d="M432,128 Q436,118 430,112 Q428,108 424,112 L424,128" fill="#1A1620"/>

  <!-- EYES — pale blue spectral glow -->
  <ellipse cx="390" cy="120" rx="5" ry="3.5" fill="#3A6878" opacity="0.9"/>
  <ellipse cx="410" cy="120" rx="5" ry="3.5" fill="#3A6878" opacity="0.9"/>
  <!-- Eye inner light -->
  <ellipse cx="390" cy="120" rx="2.5" ry="2" fill="#6AAABB" opacity="0.8"/>
  <ellipse cx="410" cy="120" rx="2.5" ry="2" fill="#6AAABB" opacity="0.8"/>
  <!-- Eye aura -->
  <ellipse cx="390" cy="120" rx="10" ry="7" fill="#3A6878" opacity="0.15"/>
  <ellipse cx="410" cy="120" rx="10" ry="7" fill="#3A6878" opacity="0.15"/>

  <!-- Spectral aura around Gunnar -->
  <ellipse cx="400" cy="220" rx="100" ry="140" fill="#1A1025" opacity="0.3"/>
  <ellipse cx="400" cy="180" rx="70" ry="90" fill="#251535" opacity="0.2"/>

  <!-- Ground mist -->
  <ellipse cx="400" cy="330" rx="300" ry="20" fill="#180C18" opacity="0.4"/>
  <ellipse cx="300" cy="335" rx="180" ry="12" fill="#180C18" opacity="0.3"/>
  <ellipse cx="520" cy="332" rx="160" ry="11" fill="#180C18" opacity="0.3"/>

  <!-- Vignette — extreme darkness at edges -->
  <radialGradient id="gvig" cx="50%" cy="50%" r="55%">
    <stop offset="15%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.88"/>
  </radialGradient>
  <rect width="800" height="420" fill="url(#gvig)"/>
</svg>
