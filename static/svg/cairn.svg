<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="csky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07080C"/>
      <stop offset="100%" stop-color="#0E0C08"/>
    </linearGradient>
    <radialGradient id="cairnglow" cx="50%" cy="60%" r="50%">
      <stop offset="0%"   stop-color="#C89030" stop-opacity="0.5"/>
      <stop offset="50%"  stop-color="#905010" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#905010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inner_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFB040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#C06010" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="420" fill="url(#csky)"/>

  <!-- Stars — more visible, night is clearer near cairn -->
  <g fill="#D0C8A0" opacity="0.7">
    <circle cx="60"  cy="20" r="1.2"/><circle cx="140" cy="35" r="0.9"/>
    <circle cx="230" cy="15" r="1.0"/><circle cx="320" cy="42" r="1.3"/>
    <circle cx="420" cy="25" r="0.8"/><circle cx="510" cy="18" r="1.1"/>
    <circle cx="600" cy="40" r="0.9"/><circle cx="700" cy="22" r="1.2"/>
    <circle cx="760" cy="45" r="0.8"/><circle cx="90"  cy="65" r="0.7"/>
    <circle cx="260" cy="58" r="1.0"/><circle cx="480" cy="62" r="0.8"/>
    <circle cx="650" cy="55" r="0.9"/><circle cx="780" cy="70" r="1.0"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="295" width="800" height="125" fill="#0E0C09"/>
  <path d="M0,302 Q400,295 800,302" stroke="#1E1A12" stroke-width="1.5" fill="none"/>

  <!-- Cairn warm glow pool on ground -->
  <ellipse cx="400" cy="360" rx="220" ry="60" fill="url(#cairnglow)"/>

  <!-- Background rocks / stones -->
  <ellipse cx="150" cy="300" rx="45" ry="18" fill="#181410"/>
  <ellipse cx="660" cy="295" rx="38" ry="15" fill="#181410"/>
  <ellipse cx="580" cy="305" rx="28" ry="12" fill="#151210"/>

  <!-- THE BONE CAIRN — centre stage -->
  <!-- Base stones -->
  <ellipse cx="400" cy="320" rx="70" ry="18" fill="#1C1A14"/>
  <!-- Main body -->
  <rect x="358" y="235" width="84" height="90" rx="6" fill="#1E1C16"/>
  <rect x="358" y="235" width="84" height="90" rx="6" stroke="#4A3E20" stroke-width="1.5" fill="none"/>
  <!-- Stone texture seams -->
  <line x1="358" y1="270" x2="442" y2="270" stroke="#2A2418" stroke-width="1" opacity="0.6"/>
  <line x1="358" y1="295" x2="442" y2="295" stroke="#2A2418" stroke-width="1" opacity="0.5"/>
  <line x1="390" y1="235" x2="390" y2="325" stroke="#2A2418" stroke-width="1" opacity="0.4"/>
  <!-- Cap stone -->
  <path d="M348,240 Q400,215 452,240 L442,235 L358,235 Z" fill="#252018"/>
  <path d="M348,240 Q400,215 452,240" stroke="#4A3E20" stroke-width="1.5" fill="none"/>

  <!-- Rune window — glowing opening -->
  <rect x="375" y="253" width="50" height="50" rx="3" fill="#0A0808"/>
  <!-- Inner fire glow -->
  <ellipse cx="400" cy="278" rx="22" ry="22" fill="url(#inner_glow)"/>
  <!-- Rune symbol -->
  <text x="400" y="284" font-family="serif" font-size="26" text-anchor="middle" fill="#FFD060" opacity="0.9">ᚠ</text>
  <!-- Rune glow aura -->
  <ellipse cx="400" cy="280" rx="28" ry="28" fill="#C89030" opacity="0.12"/>

  <!-- Flame wisps rising from top -->
  <path d="M395,235 Q390,218 396,205 Q402,195 398,182" stroke="#C07020" stroke-width="2.5" fill="none" opacity="0.6"/>
  <path d="M405,233 Q412,215 407,202 Q402,192 408,178" stroke="#C07020" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M400,232 Q396,210 402,198" stroke="#FFB030" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Small stones around base -->
  <ellipse cx="340" cy="318" rx="16" ry="7" fill="#161410"/>
  <ellipse cx="462" cy="316" rx="14" ry="6" fill="#161410"/>
  <ellipse cx="370" cy="323" rx="10" ry="5" fill="#141210"/>
  <ellipse cx="432" cy="321" rx="12" ry="5" fill="#141210"/>

  <!-- Faint rune inscriptions on ground around cairn -->
  <text x="310" y="340" font-family="serif" font-size="12" fill="#4A3E20" opacity="0.5">ᚢ</text>
  <text x="460" y="338" font-family="serif" font-size="12" fill="#4A3E20" opacity="0.5">ᚦ</text>
  <text x="350" y="355" font-family="serif" font-size="11" fill="#4A3E20" opacity="0.4">ᚨ</text>
  <text x="435" y="353" font-family="serif" font-size="11" fill="#4A3E20" opacity="0.4">ᚱ</text>

  <!-- Vignette — heavy, warm centre -->
  <radialGradient id="cavig" cx="50%" cy="65%" r="60%">
    <stop offset="30%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.8"/>
  </radialGradient>
  <rect width="800" height="420" fill="url(#cavig)"/>
</svg>
