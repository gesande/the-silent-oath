<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="100%" stop-color="#10100A"/>
    </linearGradient>
    <radialGradient id="forgelight" cx="50%" cy="80%" r="60%">
      <stop offset="0%"   stop-color="#C06010" stop-opacity="0.4"/>
      <stop offset="60%"  stop-color="#802010" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#802010" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181410"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#nightsky)"/>

  <!-- Stars -->
  <g fill="#C0B890" opacity="0.5">
    <circle cx="70"  cy="25" r="0.9"/><circle cx="180" cy="40" r="1.1"/>
    <circle cx="290" cy="18" r="0.8"/><circle cx="450" cy="32" r="1.0"/>
    <circle cx="560" cy="22" r="0.7"/><circle cx="680" cy="35" r="1.2"/>
    <circle cx="750" cy="18" r="0.8"/><circle cx="120" cy="60" r="0.7"/>
    <circle cx="380" cy="55" r="0.9"/><circle cx="620" cy="50" r="0.8"/>
  </g>

  <!-- Forge warm glow — emanating from centre -->
  <ellipse cx="400" cy="360" rx="280" ry="140" fill="url(#forgelight)"/>

  <!-- Collapsed roof timbers — background -->
  <line x1="180" y1="100" x2="420" y2="290" stroke="#1C1810" stroke-width="18" stroke-linecap="round"/>
  <line x1="620" y1="95"  x2="390" y2="285" stroke="#1C1810" stroke-width="16" stroke-linecap="round"/>
  <line x1="260" y1="80"  x2="440" y2="295" stroke="#181408" stroke-width="12" stroke-linecap="round"/>
  <line x1="540" y1="88"  x2="380" y2="292" stroke="#181408" stroke-width="10" stroke-linecap="round"/>

  <!-- Standing walls — left -->
  <rect x="100" y="160" width="20" height="220" rx="2" fill="#201C14"/>
  <rect x="140" y="145" width="18" height="235" rx="2" fill="#201C14"/>
  <!-- Wall planks texture -->
  <line x1="100" y1="200" x2="120" y2="200" stroke="#2A2418" stroke-width="1.5" opacity="0.7"/>
  <line x1="100" y1="230" x2="120" y2="230" stroke="#2A2418" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="260" x2="120" y2="260" stroke="#2A2418" stroke-width="1.5" opacity="0.5"/>
  <line x1="140" y1="195" x2="158" y2="195" stroke="#2A2418" stroke-width="1.5" opacity="0.7"/>
  <line x1="140" y1="225" x2="158" y2="225" stroke="#2A2418" stroke-width="1.5" opacity="0.6"/>

  <!-- Standing walls — right -->
  <rect x="660" y="155" width="20" height="225" rx="2" fill="#201C14"/>
  <rect x="640" y="170" width="18" height="210" rx="2" fill="#1C1810"/>

  <!-- Ground -->
  <rect x="0" y="310" width="800" height="110" fill="url(#grd)"/>
  <path d="M0,318 Q400,312 800,318" stroke="#221E14" stroke-width="1" fill="none"/>

  <!-- THE FORGE — centre-right -->
  <!-- Forge body -->
  <rect x="430" y="265" width="110" height="80" rx="4" fill="#1A1610"/>
  <rect x="430" y="265" width="110" height="80" rx="4" stroke="#3A3020" stroke-width="1.5" fill="none"/>
  <!-- Forge mouth — glowing -->
  <rect x="455" y="285" width="60" height="40" rx="3" fill="#0A0808"/>
  <rect x="458" y="288" width="54" height="34" rx="2" fill="#3A1A08" opacity="0.8"/>
  <rect x="462" y="292" width="46" height="26" rx="2" fill="#802010" opacity="0.6"/>
  <rect x="468" y="298" width="34" height="14" rx="2" fill="#C05010" opacity="0.5"/>
  <!-- Ember glow -->
  <ellipse cx="485" cy="318" rx="20" ry="6" fill="#FF6010" opacity="0.35"/>
  <!-- Forge chimney -->
  <rect x="460" y="235" width="30" height="32" rx="2" fill="#181410"/>
  <!-- Smoke wisps -->
  <path d="M468,235 Q462,215 470,200 Q478,188 466,175" stroke="#3A3830" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M480,232 Q488,210 482,195 Q476,183 484,168" stroke="#3A3830" stroke-width="2" fill="none" opacity="0.4"/>
  <!-- Anvil beside forge -->
  <rect x="360" y="295" width="55" height="20" rx="2" fill="#282018"/>
  <rect x="367" y="275" width="40" height="22" rx="1" fill="#201C14"/>
  <rect x="367" y="275" width="40" height="22" rx="1" stroke="#383020" stroke-width="1" fill="none"/>
  <!-- Hammer on anvil -->
  <rect x="382" y="265" width="8" height="12" rx="1" fill="#383028"/>
  <rect x="375" y="260" width="22" height="8" rx="2" fill="#484038"/>

  <!-- Bone Cairn — glowing faintly left of forge -->
  <rect x="240" y="285" width="50" height="55" rx="3" fill="#1A1810"/>
  <rect x="240" y="285" width="50" height="55" rx="3" stroke="#504020" stroke-width="1" fill="none"/>
  <!-- Cairn rune glow -->
  <rect x="252" y="300" width="26" height="26" rx="2" fill="#0A0808"/>
  <text x="265" y="318" font-family="serif" font-size="18" text-anchor="middle" fill="#B8903A" opacity="0.8">ᚠ</text>
  <ellipse cx="265" cy="320" rx="20" ry="8" fill="#B8903A" opacity="0.12"/>
  <!-- Cairn warm glow -->
  <ellipse cx="265" cy="325" rx="60" ry="30" fill="#B87020" opacity="0.08"/>

  <!-- Scattered tools / debris -->
  <line x1="300" y1="318" x2="340" y2="308" stroke="#383020" stroke-width="3" stroke-linecap="round"/>
  <line x1="308" y1="315" x2="308" y2="325" stroke="#383020" stroke-width="4" stroke-linecap="round"/>
  <rect x="570" y="308" width="35" height="10" rx="2" fill="#282018" opacity="0.8"/>

  <!-- Vignette -->
  <radialGradient id="vig3" cx="50%" cy="65%" r="65%">
    <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
  </radialGradient>
  <rect width="800" height="420" fill="url(#vig3)"/>
</svg>
