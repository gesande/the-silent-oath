<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08090E"/>
      <stop offset="100%" stop-color="#12100A"/>
    </linearGradient>
    <linearGradient id="fog2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#181410" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#181410" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="torch" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#C08020" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C08020" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="420" fill="url(#sky2)"/>

  <!-- Background fog planes -->
  <rect x="0" y="0" width="800" height="420" fill="#0A0C10" opacity="0.3"/>

  <!-- Broken shield-wall in background -->
  <rect x="50"  y="180" width="14" height="130" rx="2" fill="#1E1C18" opacity="0.7"/>
  <rect x="80"  y="165" width="14" height="145" rx="2" fill="#1E1C18" opacity="0.6"/>
  <rect x="110" y="172" width="14" height="138" rx="2" fill="#1E1C18" opacity="0.7"/>
  <rect x="140" y="158" width="14" height="152" rx="2" fill="#1E1C18" opacity="0.5"/>
  <!-- Shield planks across -->
  <rect x="48" y="200" width="110" height="8" rx="1" fill="#252018" opacity="0.6"/>
  <rect x="48" y="240" width="110" height="8" rx="1" fill="#252018" opacity="0.5"/>

  <!-- Ground -->
  <rect x="0" y="300" width="800" height="120" fill="#100E0A"/>
  <path d="M0,305 Q400,298 800,305" stroke="#1E1A14" stroke-width="1.5" fill="none"/>

  <!-- Torch glow on left — warm ambient -->
  <circle cx="145" cy="260" r="90" fill="url(#torch)"/>

  <!-- LEIF — the dying soldier sitting against shield-wall -->
  <!-- Body sitting, leaning against wall -->
  <!-- Legs -->
  <path d="M370,370 Q380,340 395,330 Q405,325 410,345 Q415,365 420,375" stroke="#2A2018" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M390,370 Q400,345 415,340 Q428,338 430,358 Q432,370 438,378" stroke="#2A2018" stroke-width="13" fill="none" stroke-linecap="round"/>
  <!-- Torso leaning back -->
  <rect x="372" y="295" width="55" height="75" rx="8" fill="#252018"/>
  <!-- Chainmail texture hint -->
  <rect x="375" y="300" width="49" height="5" rx="1" fill="#302818" opacity="0.6"/>
  <rect x="375" y="310" width="49" height="5" rx="1" fill="#302818" opacity="0.5"/>
  <rect x="375" y="320" width="49" height="5" rx="1" fill="#302818" opacity="0.4"/>
  <!-- Arm resting -->
  <path d="M372,320 Q345,335 330,355" stroke="#252018" stroke-width="16" fill="none" stroke-linecap="round"/>
  <!-- Wounded arm with arrow -->
  <path d="M427,315 Q455,310 480,305" stroke="#252018" stroke-width="15" fill="none" stroke-linecap="round"/>
  <!-- Arrow shaft -->
  <line x1="440" y1="308" x2="510" y2="285" stroke="#4A3820" stroke-width="3"/>
  <polygon points="510,285 504,278 516,279" fill="#606040"/>
  <!-- Arrow fletching -->
  <path d="M442,307 Q438,300 444,296" stroke="#8A6A30" stroke-width="2" fill="none"/>
  <!-- Head tilted, looking up -->
  <circle cx="400" cy="278" r="22" fill="#1C1810"/>
  <!-- Face — tired eyes -->
  <ellipse cx="392" cy="275" rx="3.5" ry="2.5" fill="#3A6878" opacity="0.7"/>
  <ellipse cx="408" cy="275" rx="3.5" ry="2.5" fill="#3A6878" opacity="0.7"/>
  <!-- Helmet -->
  <path d="M378,270 Q380,252 400,250 Q420,252 422,270 Z" fill="#282018"/>
  <!-- Nasal guard -->
  <rect x="398" y="265" width="4" height="12" rx="1" fill="#302820"/>

  <!-- Blood on ground beneath him -->
  <ellipse cx="385" cy="378" rx="30" ry="8" fill="#3A1010" opacity="0.5"/>
  <ellipse cx="370" cy="382" rx="18" ry="5" fill="#3A1010" opacity="0.4"/>

  <!-- Broken spear leaning beside him -->
  <line x1="350" y1="230" x2="360" y2="360" stroke="#3A3020" stroke-width="3"/>
  <line x1="360" y1="360" x2="358" y2="400" stroke="#3A3020" stroke-width="3"/>

  <!-- Ground fog -->
  <rect x="0" y="340" width="800" height="80" fill="url(#fog2)"/>

  <!-- Atmospheric particles — dust motes -->
  <circle cx="280" cy="320" r="1.5" fill="#C8B880" opacity="0.3"/>
  <circle cx="460" cy="295" r="1"   fill="#C8B880" opacity="0.25"/>
  <circle cx="520" cy="340" r="1.2" fill="#C8B880" opacity="0.2"/>

  <!-- Vignette -->
  <radialGradient id="vig2" cx="50%" cy="60%" r="65%">
    <stop offset="20%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
  </radialGradient>
  <rect width="800" height="420" fill="url(#vig2)"/>
</svg>
